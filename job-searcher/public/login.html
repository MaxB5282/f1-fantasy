<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Tracker — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      text-align: center;
    }

    .icon { font-size: 2.4rem; margin-bottom: 12px; }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }

    p {
      font-size: 0.875rem;
      color: #64748b;
      margin-bottom: 28px;
    }

    input[type="password"] {
      width: 100%;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 1rem;
      color: #0f172a;
      background: #f8fafc;
      transition: border-color 0.15s;
      margin-bottom: 12px;
      text-align: center;
      letter-spacing: 0.1em;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: #2563eb;
      background: white;
    }

    button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.12s;
    }

    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }

    .error {
      color: #dc2626;
      font-size: 0.82rem;
      margin-top: 10px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">💼</div>
    <h1>Job Tracker</h1>
    <p>Enter the password to access your job tracker.</p>

    <form id="form" onsubmit="login(event)">
      <input id="password" type="password" placeholder="Password" autofocus autocomplete="current-password" />
      <button id="btn" type="submit">Sign In</button>
      <div class="error" id="error"></div>
    </form>
  </div>

  <script>
    async function login(e) {
      e.preventDefault();
      const pw = document.getElementById('password').value;
      const btn = document.getElementById('btn');
      const err = document.getElementById('error');

      btn.disabled = true;
      btn.textContent = 'Signing in...';
      err.textContent = '';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw }),
        });

        if (res.ok) {
          window.location.href = '/';
        } else {
          err.textContent = 'Wrong password. Try again.';
          btn.disabled = false;
          btn.textContent = 'Sign In';
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      } catch {
        err.textContent = 'Could not connect. Try again.';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
